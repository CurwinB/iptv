<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#050505"/><title>IPTV Player</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script><style>:root{color-scheme:dark;--bg:#050505;--border:#242424;--muted:#8c8c8c;--text:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:360px 1fr}aside{border-right:1px solid var(--border);background:#090909;display:flex;flex-direction:column;min-width:0}header{padding:18px;border-bottom:1px solid var(--border)}.brand{font-weight:800;font-size:20px;margin-bottom:14px}.search{width:100%;background:#151515;border:1px solid var(--border);color:white;border-radius:10px;padding:11px 12px;outline:none}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.filter-label{display:block;min-width:0}.filter-label span{display:block;color:#777;font-size:10px;margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.06em}select{width:100%;min-width:0;background:#151515;color:#ddd;border:1px solid var(--border);border-radius:9px;padding:9px}#count{color:var(--muted);font-size:12px;margin-top:10px}.list{overflow:auto;padding:8px;flex:1}.channel{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:white;padding:10px;border-radius:9px;text-align:left;cursor:pointer}.channel:hover,.channel.active{background:#191919}.logo{width:42px;height:30px;object-fit:contain;background:#151515;border-radius:5px;flex:0 0 42px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.meta{color:#777;font-size:10px;margin-top:3px}.load-more{display:block;width:calc(100% - 16px);margin:0 8px 8px;padding:10px;background:#151515;border:1px solid var(--border);color:#bbb;border-radius:9px}.load-more[hidden]{display:none}main{min-width:0;display:flex;flex-direction:column}.topbar{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:15px}#now{min-width:0}#now strong{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#status{color:var(--muted);font-size:12px;margin-top:4px}.controls{display:flex;gap:8px}button{border:1px solid var(--border);background:#151515;color:#ddd;border-radius:8px;padding:9px 12px;cursor:pointer}.video-wrap{position:relative;background:#000;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;max-height:calc(100vh - 82px);object-fit:contain;background:#000}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#777;text-align:center;padding:30px;pointer-events:none}.error{color:#ff8b8b!important}@media(max-width:850px){.app{grid-template-columns:1fr;grid-template-rows:52vh 48vh}aside{order:2;border-right:0;border-top:1px solid var(--border)}main{order:1}video{max-height:52vh}.topbar{padding:11px 14px}}</style></head><body><div class="app"><aside><header><div class="brand">IPTV Player</div><input id="search" class="search" placeholder="Search channels..." autocomplete="off"/><div class="filters"><label class="filter-label"><span>Country</span><select id="country"><option value="">All countries</option></select></label><label class="filter-label"><span>Language</span><select id="language"><option value="">All languages</option></select></label><label class="filter-label"><span>Category</span><select id="group"><option value="">All categories</option></select></label></div><div id="count">Loading channel database...</div></header><div id="channels" class="list"></div><button id="loadMore" class="load-more" hidden>Load more channels</button></aside><main><div class="topbar"><div id="now"><strong>Select a channel</strong><div id="status">Loading public IPTV data</div></div><div class="controls"><button id="mute">Unmute</button><button id="fullscreen">Fullscreen</button></div></div><div class="video-wrap"><video id="video" controls playsinline></video><div id="empty" class="empty">Choose a channel to start watching.</div></div></main></div><script>
const API='https://iptv-org.github.io/api',params=new URLSearchParams(location.search),STREAMS_URL=params.get('streams')||`${API}/streams.json`,CHANNELS_URL=params.get('channels')||`${API}/channels.json`,LANGUAGES_URL=params.get('languages')||`${API}/languages.json`,video=document.getElementById('video'),channelsEl=document.getElementById('channels'),loadMore=document.getElementById('loadMore'),searchEl=document.getElementById('search'),countryEl=document.getElementById('country'),languageEl=document.getElementById('language'),groupEl=document.getElementById('group'),countEl=document.getElementById('count'),nowEl=document.getElementById('now'),emptyEl=document.getElementById('empty');let channels=[],filteredChannels=[],visibleCount=80,hls=null,activeUrl='';const countryNames=new Intl.DisplayNames(['en'],{type:'region'}),languageNames=new Intl.DisplayNames(['en'],{type:'language'});function countryName(c){try{return countryNames.of(c)||c}catch{return c||''}}function languageName(c){try{return languageNames.of(c)||c}catch{return c||''}}function categoryName(id){return String(id||'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fillSelect(el,values,label){el.innerHTML='<option value="">'+label+'</option>';[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)})}function render(reset=true){if(reset)visibleCount=80;const q=searchEl.value.toLowerCase().trim(),country=countryEl.value,language=languageEl.value,group=groupEl.value;filteredChannels=channels.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))&&(!country||c.countryName===country)&&(!language||c.languages.includes(language))&&(!group||c.categories.some(x=>categoryName(x)===group)));countEl.textContent=`${filteredChannels.length.toLocaleString()} channels`;channelsEl.replaceChildren();appendChannels();}function appendChannels(){const end=Math.min(visibleCount,filteredChannels.length),frag=document.createDocumentFragment();for(let i=visibleCount-(visibleCount===80?80:40);i<end;i++){const c=filteredChannels[i];if(!c)continue;const b=document.createElement('button');b.className='channel'+(c.url===activeUrl?' active':'');b.dataset.url=c.url;b.innerHTML=`<img class="logo" loading="lazy" src="${esc(c.logo)}" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.languages.join(' • ')||c.categories.map(categoryName).join(' • ')||c.countryName||'Live')}</div></div>`;frag.appendChild(b)}channelsEl.appendChild(frag);loadMore.hidden=end>=filteredChannels.length;}function setStatus(t,error=false){const s=document.getElementById('status');s.textContent=t;s.className=error?'error':''}function proxyUrl(url){return `/api/stream?url=${encodeURIComponent(url)}`}function play(c){activeUrl=c.url;emptyEl.style.display='none';nowEl.innerHTML=`<strong>${esc(c.name)}</strong><div id="status">Connecting...</div>`;document.querySelectorAll('.channel.active').forEach(x=>x.classList.remove('active'));const selected=[...document.querySelectorAll('.channel')].find(x=>x.dataset.url===c.url);if(selected)selected.classList.add('active');if(hls){hls.destroy();hls=null}video.pause();video.removeAttribute('src');video.load();const source=proxyUrl(c.url);if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:30});hls.attachMedia(video);hls.on(Hls.Events.MEDIA_ATTACHED,()=>hls.loadSource(source));hls.on(Hls.Events.MANIFEST_PARSED,()=>{setStatus('Ready to play');video.play().then(()=>setStatus('Playing')).catch(()=>setStatus('Press play to start'))});hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){hls.destroy();hls=null;setStatus(`Stream error: ${d.details||'unavailable'}`,true)}});return}if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=source;video.addEventListener('loadedmetadata',()=>setStatus('Ready to play'),{once:true});video.addEventListener('error',()=>setStatus('Stream unavailable or blocked',true),{once:true});video.play().then(()=>setStatus('Playing')).catch(()=>setStatus('Press play to start'))}else setStatus('This browser does not support HLS',true)}async function getJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}async function load(){try{setStatus('Loading channel metadata...');const[cdata,sdata,ldata]=await Promise.all([getJson(CHANNELS_URL),getJson(STREAMS_URL),getJson(LANGUAGES_URL)]),byId=new Map(cdata.map(c=>[c.id,c])),langMap=new Map(ldata.map(l=>[l.code,l.name]));channels=[];for(const s of sdata){const m=byId.get(s.channel);if(!m||!s.url)continue;const codes=Array.isArray(m.languages)?m.languages:[],langs=codes.map(x=>langMap.get(x)||languageName(x)||x).filter(Boolean);channels.push({id:m.id,name:m.name||m.id,url:s.url,countryName:countryName(m.country),languages:langs,categories:Array.isArray(m.categories)?m.categories:[],logo:`https://iptv-org.github.io/iptv/logos/${encodeURIComponent(m.id)}.png`})}const seen=new Set();channels=channels.filter(c=>{const k=c.id+'|'+c.url;if(seen.has(k))return false;seen.add(k);return true});if(!channels.length)throw Error('No playable channels found');fillSelect(countryEl,channels.map(c=>c.countryName),'All countries');fillSelect(languageEl,channels.flatMap(c=>c.languages),'All languages');fillSelect(groupEl,channels.flatMap(c=>c.categories.map(categoryName)),'All categories');render();setStatus(`${channels.length.toLocaleString()} playable streams loaded`)}catch(e){countEl.textContent='Could not load channel data';setStatus(e.message,true);console.error(e)}}let searchTimer;searchEl.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>render(true),150)});countryEl.onchange=()=>render(true);languageEl.onchange=()=>render(true);groupEl.onchange=()=>render(true);loadMore.onclick=()=>{visibleCount+=80;appendChannels()};channelsEl.addEventListener('click',e=>{const b=e.target.closest('.channel');if(!b)return;const c=channels.find(x=>x.url===b.dataset.url);if(c)play(c)});document.getElementById('mute').onclick=()=>{video.muted=!video.muted;document.getElementById('mute').textContent=video.muted?'Unmute':'Mute'};document.getElementById('fullscreen').onclick=()=>{const w=document.querySelector('.video-wrap');if(w.requestFullscreen)w.requestFullscreen()};load();
</script></body></html>
